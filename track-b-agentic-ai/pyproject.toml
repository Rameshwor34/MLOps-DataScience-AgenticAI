[project]
name = "shopassist-agentic-mlops"
version = "3.0.0"
description = "Track B: ShopAssist AI W15+W16+W17 Agentic MLOps"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.29.0",
    "google-genai>=1.0.0",
    "chromadb>=0.5.0",
    "torch",
    "sentence-transformers>=3.0.0",
    "mlflow>=2.13.0",
    "evidently>=0.4.30",
    "python-dotenv>=1.0.0",
    "httpx>=0.27.0",
    "requests>=2.31.0",
    "pydantic>=2.5.0",
    "pytest>=8.0.0",
    "pandas>=2.0.0",
    "numpy>=1.26.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend"]

[tool.pytest.ini_options]
testpaths = [
    "tests",
    "backend/tests",
]
