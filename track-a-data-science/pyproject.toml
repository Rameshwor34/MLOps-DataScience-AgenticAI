[project]
name = "telco-churn-mlops"
version = "0.1.0"
description = "Track A: Data Science MLOps pipeline for Telco Churn classification"
requires-python = ">=3.12"
dependencies = [
    "scikit-learn>=1.3.0",
    "pandas>=2.0.0",
    "numpy>=1.26.0",
    "mlflow>=2.13.0",
    "evidently>=0.4.30",
    "matplotlib>=3.7.0",
    "seaborn>=0.13.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.29.0",
    "requests>=2.31.0",
    "python-dotenv>=1.0.0",
    "joblib>=1.3.0",
    "pytest>=8.0.0",
    "httpx>=0.27.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
